name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: billing
          POSTGRES_DB: billing_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U billing" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run ruff check .
      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+asyncpg://billing:billing@localhost:5432/billing_test' || 'sqlite+aiosqlite:///./ci.db' }}
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Tests
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+asyncpg://billing:billing@localhost:5432/billing_test' || '' }}
        run: uv run pytest -q
